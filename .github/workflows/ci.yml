name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Lint and Code Format Check
      run: |
        ruff check src/ tests/ training/ scripts/

    - name: Run Unit Tests (no dataset required)
      run: |
        pytest tests/ -v -m "not integration" --cov=src --cov-report=term-missing

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker API Image
      run: |
        docker build -t fraud-detection-api:ci -f deployment/docker/Dockerfile.api .
